apiVersion: v1
kind: ServiceAccount
metadata:
  name: netkit-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netkit-agent
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netkit-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netkit-agent
subjects:
  - kind: ServiceAccount
    name: netkit-agent
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netkit-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: netkit-cni
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netkit-cni
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netkit-cni
    spec:
      serviceAccountName: netkit-agent
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
        - operator: Exists
      initContainers:
        - name: install-cni-binaries
          image: netkit-cni:dev
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -ec
            - |
              install -m 0755 /out/netkit-cni /host/opt/cni/bin/netkit-cni
              install -m 0755 /out/host-local /host/opt/cni/bin/host-local
          securityContext:
            privileged: true
          volumeMounts:
            - name: cni-bin
              mountPath: /host/opt/cni/bin
      containers:
        - name: agent
          image: netkit-cni:dev
          imagePullPolicy: Never
          args:
            - --cni-config=/host/etc/cni/net.d/10-netkit-cni.conf
            - --interval=5s
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: cni-conf
              mountPath: /host/etc/cni/net.d
      volumes:
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: Directory
        - name: cni-conf
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
